<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    window.navigateTo = function(queryParam) {
        window.currentVirtualQuery = queryParam;
        try {
            if (window.history && window.history.pushState) {
                window.history.pushState({}, '', queryParam || window.location.pathname);
            }
        } catch (e) {}
        if (typeof window.handleRoute === 'function') {
            window.handleRoute();
        }
    };

    const appId = (typeof __app_id !== 'undefined' ? __app_id : 'vibegram-default-app').replace(/[.#$\[\]]/g, '_');
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
        apiKey: "AIzaSyDummyKeyForVibegramFallback12345",
        authDomain: "vibegram-app.firebaseapp.com",
        databaseURL: "https://vibegram-app-default-rtdb.firebaseio.com",
        projectId: "vibegram-app"
    };

    let app, auth, db;
    try {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getDatabase(app);
    } catch (e) {
        console.error('Firebase error:', e);
    }

    let firebaseUser = null;
    let currentUser = null;
    let currentProfileUid = null;
    let isOwner = false;
    let isEditingActive = false;

    let profileDataState = {
        displayName: 'Мой Профиль',
        searchName: 'мой профиль',
        tgUsername: '@user',
        photoBase64: 'https://placehold.co/120x120/151515/ff2e88?text=V',
        bannerBase64: '',
        about: 'Привет! Это мой профиль в Vibegram 🚀',
        favoriteColor: '#ff2e88',
        userPhotos: [],
        favoriteGames: [],
        vibeCount: 1,
        vibeGivers: []
    };

    function showToast(message) {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = message;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    async function saveProfileToFirebase() {
        if (!auth || !auth.currentUser) return;
        try {
            const profileRef = ref(db, `artifacts/${appId}/public/data/profiles/${auth.currentUser.uid}`);
            await set(profileRef, profileDataState);
        } catch (err) {}
    }

    window.handleRoute = function() {
        const urlParams = new URLSearchParams(window.currentVirtualQuery || window.location.search);
        const uidParam = urlParams.get('uid');
        const viewSearch = document.getElementById('view-search');
        const viewProfile = document.getElementById('view-profile');

        if (uidParam) {
            if (viewSearch) viewSearch.classList.remove('active');
            if (viewProfile) viewProfile.classList.add('active');
            currentProfileUid = uidParam;
            isOwner = auth && auth.currentUser && auth.currentUser.uid === uidParam;
            
            const toggleEditBtn = document.getElementById('toggle-edit-btn');
            if (toggleEditBtn) toggleEditBtn.classList.toggle('hidden', !isOwner);

            get(ref(db, `artifacts/${appId}/public/data/profiles/${uidParam}`)).then(snap => {
                if (snap.exists()) {
                    profileDataState = snap.val();
                }
                renderProfileUI();
            });
        } else {
            if (viewProfile) viewProfile.classList.remove('active');
            if (viewSearch) viewSearch.classList.add('active');
        }
    };

    function renderProfileUI() {
        const avatarImg = document.getElementById('profile-avatar-img');
        const displayNameInput = document.getElementById('profile-display-name');
        const aboutInputInline = document.getElementById('profile-about-inline');

        if (avatarImg) avatarImg.src = profileDataState.photoBase64 || 'https://placehold.co/120x120/151515/ff2e88?text=V';
        if (displayNameInput) displayNameInput.value = profileDataState.displayName || 'Пользователь';
        if (aboutInputInline) aboutInputInline.value = profileDataState.about || '';
    }

    window.addEventListener('load', async () => {
        if (auth) {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                try { await signInAnonymously(auth); } catch (err) {}
            }

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    firebaseUser = user;
                    currentUser = { uid: user.uid, username: '@user_' + user.uid.substring(0,6) };
                    updateAuthUI(currentUser);
                }
            });
        }

        // Кнопка открытия модального окна входа
        const headerLoginBtn = document.getElementById('header-login-btn');
        const authModalBackdrop = document.getElementById('auth-modal-backdrop');
        if (headerLoginBtn && authModalBackdrop) {
            headerLoginBtn.onclick = () => {
                authModalBackdrop.classList.add('active');
            };
        }

        // Переключение между Входом и Регистрацией
        const tabLoginBtn = document.getElementById('tab-login-btn');
        const tabRegisterBtn = document.getElementById('tab-register-btn');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');

        if (tabLoginBtn && tabRegisterBtn && loginForm && registerForm) {
            tabLoginBtn.onclick = () => {
                tabLoginBtn.classList.add('active');
                tabRegisterBtn.classList.remove('active');
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
            };

            tabRegisterBtn.onclick = () => {
                tabRegisterBtn.classList.add('active');
                tabLoginBtn.classList.remove('active');
                registerForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            };
        }

        // Обработка отправки формы входа
        const loginFormEl = document.getElementById('login-form');
        if (loginFormEl) {
            loginFormEl.onsubmit = (e) => {
                e.preventDefault();
                if (auth && auth.currentUser) {
                    currentUser = { uid: auth.currentUser.uid, username: '@user' };
                    updateAuthUI(currentUser);
                    authModalBackdrop.classList.remove('active');
                    window.navigateTo(`?uid=${auth.currentUser.uid}`);
                    showToast('Успешный вход!');
                }
            };
        }

        // Обработка регистрации
        const registerFormEl = document.getElementById('register-form');
        if (registerFormEl) {
            registerFormEl.onsubmit = async (e) => {
                e.preventDefault();
                const nickname = document.getElementById('reg-nickname').value.trim();
                let tgUsername = document.getElementById('reg-username').value.trim().toLowerCase();
                if (!tgUsername.startsWith('@')) tgUsername = '@' + tgUsername;

                if (auth && auth.currentUser) {
                    profileDataState.displayName = nickname;
                    profileDataState.tgUsername = tgUsername;
                    await saveProfileToFirebase();

                    currentUser = { uid: auth.currentUser.uid, username: tgUsername };
                    updateAuthUI(currentUser);
                    authModalBackdrop.classList.remove('active');
                    window.navigateTo(`?uid=${auth.currentUser.uid}`);
                    showToast('Регистрация успешна!');
                }
            };
        }

        // Тестовый вход без авторизации
        const demoModeBtn = document.getElementById('demo-mode-btn');
        if (demoModeBtn) {
            demoModeBtn.onclick = (e) => {
                e.preventDefault();
                if (auth && auth.currentUser) {
                    currentUser = { uid: auth.currentUser.uid, username: '@demo' };
                    updateAuthUI(currentUser);
                    authModalBackdrop.classList.remove('active');
                    window.navigateTo(`?uid=${auth.currentUser.uid}`);
                    showToast('Демо-режим активирован!');
                }
            };
        }

        const logoBtn = document.getElementById('logo-btn');
        if (logoBtn) {
            logoBtn.onclick = () => window.navigateTo('');
        }

        window.handleRoute();
    });

    function updateAuthUI(user) {
        const loginBtn = document.getElementById('header-login-btn');
        const avatarBtn = document.getElementById('header-avatar-btn');
        if (user) {
            if (loginBtn) loginBtn.classList.add('hidden');
            if (avatarBtn) avatarBtn.classList.remove('hidden');
        } else {
            if (loginBtn) loginBtn.classList.remove('hidden');
            if (avatarBtn) avatarBtn.classList.add('hidden');
        }
    }
</script>
